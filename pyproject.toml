[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cstr-convergence"
version = "0.4.2.post1"
description = "Objective-specific kinetic criteria and decision-oriented finite-CSTR reactor staging"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
